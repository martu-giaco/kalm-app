<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgRutina" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C8994"/>
      <stop offset="100%" stop-color="#122E31"/>
    </linearGradient>
    <radialGradient id="glowRutina" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8DE2E8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8DE2E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bgRutina)"/>
  <rect width="800" height="480" fill="url(#glowRutina)"/>

  <circle cx="90" cy="420" r="150" fill="#173338" opacity="0.35"/>
  <circle cx="720" cy="60" r="120" fill="#37A0AF" opacity="0.18"/>

  <g fill="#E7F7F8">
    <path d="M130 60 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.85"/>
    <path d="M600 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" opacity="0.7"/>
  </g>

  <!-- Personaje sosteniendo pote de crema -->
  <g transform="translate(370,60)">
    <!-- pelo -->
    <path d="M60 70 Q55 5 130 0 Q205 5 200 70 Q205 40 190 35 Q175 -5 130 5 Q90 -5 75 35 Q60 40 60 70Z" fill="#173338"/>
    <path d="M195 30 Q210 45 195 60" stroke="#173338" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- cuerpo -->
    <path d="M45 300 Q45 210 130 210 Q215 210 215 300 L215 380 L45 380 Z" fill="#2C8994"/>
    <path d="M45 300 Q45 225 105 212 L105 380 L45 380 Z" fill="#20707A"/>

    <!-- cuello -->
    <rect x="108" y="150" width="40" height="45" rx="14" fill="#CFE7E8"/>

    <!-- rostro -->
    <path d="M68 90 Q68 25 130 22 Q192 25 192 90 Q192 145 130 152 Q68 145 68 90Z" fill="#CFE7E8"/>
    <circle cx="108" cy="88" r="5" fill="#173338"/>
    <circle cx="150" cy="88" r="5" fill="#173338"/>
    <path d="M112 110 Q130 120 148 110" stroke="#173338" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- brazo levantado sosteniendo pote junto al rostro -->
    <path d="M40 260 Q0 200 40 130 Q55 115 65 130 Q40 190 70 250 Z" fill="#CFE7E8"/>
    <g transform="translate(15,110)">
      <rect x="0" y="0" width="55" height="42" rx="8" fill="#173338"/>
      <rect x="4" y="-10" width="47" height="14" rx="6" fill="#0F282B"/>
    </g>

    <!-- mano tocando el pelo -->
    <path d="M200 150 Q235 100 210 55 Q195 45 188 60 Q210 100 185 140 Z" fill="#CFE7E8"/>

    <!-- destello -->
    <path d="M35 80 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z" fill="#FFFFFF" opacity="0.9"/>

    <!-- frascos decorativos flotando -->
    <g transform="translate(230,230)">
      <rect x="0" y="0" width="34" height="55" rx="8" fill="#37A0AF"/>
      <rect x="8" y="-10" width="18" height="14" rx="4" fill="#173338"/>
    </g>
    <g transform="translate(-40,250)">
      <rect x="0" y="0" width="30" height="46" rx="15" fill="#9FE7EC"/>
      <rect x="9" y="-8" width="12" height="12" rx="3" fill="#173338"/>
    </g>
  </g>
</svg>
